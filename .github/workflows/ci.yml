name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --locked
      - run: cargo build --locked --example release
      - run: python scripts/test_packaging.py
      - run: python scripts/test_release.py
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check macOS menu bar startup
        if: runner.os == 'macOS'
        run: cargo run --locked --example macos_desktop_smoke
