[package]
name = "kbmouse"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven virtual mouse"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "xtest", "xfixes"] }

[profile.release]
lto = "thin"
strip = true
