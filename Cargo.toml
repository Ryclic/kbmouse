[package]
name = "kbmouse"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven virtual mouse"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
self_update = { version = "1.3.0", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "signatures"] }
semver = "1.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "xtest", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
core-graphics = { version = "0.23.2", features = ["highsierra"] }
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSDictionary", "NSString", "NSGeometry", "NSObject", "NSRunLoop"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "libc", "objc2-core-foundation",
    "NSAlert", "NSApplication", "NSResponder", "NSPanel", "NSWindow", "NSView", "NSControl",
    "NSImageView", "NSImage", "NSColor", "NSBezierPath", "NSFont", "NSFontDescriptor",
    "NSGraphicsContext", "NSGraphics", "NSAttributedString", "NSStringDrawing",
    "NSShadow", "NSCell", "NSEvent", "NSRunningApplication", "NSWorkspace",
] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tar = "0.4.46"
flate2 = "1.1.9"
zipsign-api = { version = "0.2.1", default-features = false, features = ["sign-tar", "sign-zip", "verify-tar", "verify-zip"] }
getrandom = "0.4.3"
